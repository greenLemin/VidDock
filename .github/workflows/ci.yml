name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: npm ci

      - name: Code formatting check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build extension & host
        run: npm run build

      - name: Unit & Integration tests
        run: npm test

      - name: E2E test suite
        run: npm run test:e2e

      - name: Build release packages
        run: npm run package

      - name: Verify release packages exist
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          test -f "release/VidDock-${TAG}-chrome.zip"
          test -f "release/VidDock-${TAG}-macos-installer.zip"
          test -f "release/VidDock-${TAG}-source.zip"
          test -f release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: viddock-release-packages
          path: release/*
          if-no-files-found: error

  macos:
    name: macOS Companion & Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: npm ci

      - name: Build extension & host
        run: npm run build

      - name: Unit & Integration tests
        run: npm test

      - name: E2E test suite
        run: npm run test:e2e

      - name: Install macOS native companion host
        run: bash scripts/install-macos.sh pknljchblnkgfmfcfdfkddedjofmjbkj

      - name: Verify installation
        run: bash scripts/verify-installation.sh
