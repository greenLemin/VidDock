name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional override, e.g. v1.0.1; defaults to package.json version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Full verification
        run: npm run verify

      - name: E2E test suite
        run: npm run test:e2e

      - name: Derive release version
        id: version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_TAG="v${PKG_VERSION}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$PKG_TAG"
          fi
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pkg_tag=${PKG_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build release packages
        run: npm run package

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            release/VidDock-${{ steps.version.outputs.pkg_tag }}-chrome.zip
            release/VidDock-${{ steps.version.outputs.pkg_tag }}-macos-installer.zip
            release/VidDock-${{ steps.version.outputs.pkg_tag }}-source.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
