<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>VidDock — Download Manager</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Top Bar -->
      <header class="dashboard-header glass-panel">
        <div class="header-left">
          <svg class="brand-logo" width="28" height="28" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="url(#logo-grad)" />
            <path d="M11 10L23 16L11 22V10Z" fill="white" />
            <path d="M9 25H23V27H9V25Z" fill="white" opacity="0.8" />
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0071e3" />
                <stop offset="1" stop-color="#5856d6" />
              </linearGradient>
            </defs>
          </svg>
          <div>
            <h1 class="header-title">VidDock</h1>
            <p class="header-subtitle">Download Manager & Task Pipeline</p>
          </div>
        </div>

        <div class="header-stats">
          <div class="stat-badge">
            <span class="stat-label">Active:</span>
            <span id="stat-active" class="stat-value">0</span>
          </div>
          <div class="stat-badge">
            <span class="stat-label">Total Speed:</span>
            <span id="stat-speed" class="stat-value">0 B/s</span>
          </div>
          <div class="stat-badge">
            <span class="stat-label">Total Tasks:</span>
            <span id="stat-total" class="stat-value">0</span>
          </div>
        </div>

        <div class="header-right">
          <button
            id="btn-clear-completed"
            class="btn-secondary btn-sm"
            title="Clear finished, failed, and cancelled tasks"
          >
            Clear Completed
          </button>
          <button id="btn-open-settings" class="icon-button" title="Settings" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- Controls Toolbar -->
      <div class="dashboard-toolbar">
        <!-- Filter Segmented Tabs -->
        <div id="filter-tabs" class="segmented-control">
          <button class="segment-btn active" data-filter="all">All</button>
          <button class="segment-btn" data-filter="active">Active</button>
          <button class="segment-btn" data-filter="queued">Queued</button>
          <button class="segment-btn" data-filter="completed">Completed</button>
          <button class="segment-btn" data-filter="failed">Failed</button>
        </div>

        <!-- Search & Sort -->
        <div class="toolbar-search-sort">
          <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              id="search-input"
              type="text"
              class="glass-input"
              placeholder="Search tasks..."
              aria-label="Search downloads"
            />
          </div>

          <div class="select-wrapper" style="width: 170px">
            <select id="sort-select" class="select-apple" aria-label="Sort downloads">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="name">Title (A-Z)</option>
              <option value="size">Size (Largest)</option>
            </select>
            <span class="select-chevron">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </span>
          </div>
        </div>
      </div>

      <!-- Main Tasks Container -->
      <main class="dashboard-main">
        <div id="tasks-container" class="tasks-container"></div>

        <!-- Empty State -->
        <div id="dashboard-empty-state" class="empty-state hidden">
          <div class="empty-state-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="4" width="20" height="16" rx="4" />
              <path d="M12 9v6M9 12l3 3 3-3" />
            </svg>
          </div>
          <h3 class="empty-state-title">No Download Tasks Found</h3>
          <p class="empty-state-desc">
            Start downloading video streams from the VidDock extension popup to track their real-time progress here.
          </p>
        </div>
      </main>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
